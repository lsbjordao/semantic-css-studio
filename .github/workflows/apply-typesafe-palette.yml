name: Apply TypeSafe palette retune

on:
  push:
    branches:
      - feat/typesafe-preset
    paths:
      - scripts/retune-typesafe-palette.ts
      - .github/workflows/apply-typesafe-palette.yml

permissions:
  contents: write

jobs:
  retune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/typesafe-preset

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx vite-node scripts/retune-typesafe-palette.ts
      - run: npx vite-node scripts/add-typesafe-preset.ts
      - run: npx prettier --write scripts/retune-typesafe-palette.ts scripts/add-typesafe-preset.ts src/theme/presets/index.ts tests/snapshots/presets/typesafe.css
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Commit generated TypeSafe palette
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/retune-typesafe-palette.ts scripts/add-typesafe-preset.ts src/theme/presets/index.ts tests/snapshots/presets/typesafe.css
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "fix: restore TypeSafe pink brand palette"
            git push
          fi
