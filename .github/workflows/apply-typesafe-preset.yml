name: Apply TypeSafe preset

on:
  push:
    branches: [feat/typesafe-preset]
    paths:
      - scripts/add-typesafe-preset.ts
      - .github/workflows/apply-typesafe-preset.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/typesafe-preset
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite-node scripts/add-typesafe-preset.ts
      - run: npx prettier --write scripts/add-typesafe-preset.ts src/theme/presets/index.ts tests/snapshots/presets/typesafe.css
      - run: npm test
      - run: npm run build
      - name: Commit generated preset
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/add-typesafe-preset.ts src/theme/presets/index.ts tests/snapshots/presets/typesafe.css
          git commit -m "feat: add TypeSafe-inspired preset"
          git push origin HEAD:feat/typesafe-preset
