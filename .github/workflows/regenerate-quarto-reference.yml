name: Regenerate Quarto reference

on:
  push:
    branches:
      - fix/quarto-1.10-reference
    paths:
      - .github/workflows/regenerate-quarto-reference.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/quarto-1.10-reference

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Quarto 1.10.18
        run: |
          curl -fL https://github.com/quarto-dev/quarto-cli/releases/download/v1.10.18/quarto-1.10.18-linux-amd64.deb -o "${RUNNER_TEMP}/quarto.deb"
          sudo dpkg -i "${RUNNER_TEMP}/quarto.deb"

      - name: Regenerate and validate
        run: |
          npm run preview:quarto
          npm test
          npm run lint
          npm run format:check
          npm run build

      - name: Commit generated reference
        run: |
          rm .github/workflows/regenerate-quarto-reference.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/previews/quarto.html .github/workflows/regenerate-quarto-reference.yml
          git commit -m "chore: regenerate Quarto 1.10.18 preview"
          git push
